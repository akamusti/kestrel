name: AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Stage AppDir
        run: DESTDIR="$PWD/AppDir" cmake --install build

      - name: Fetch linuxdeploy
        run: |
          curl -fL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fL -o linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Package
        run: |
          export OUTPUT="Kestrel-${GITHUB_REF_NAME:-dev}-x86_64.AppImage"
          ./linuxdeploy --appimage-extract-and-run \
            --appdir AppDir \
            --plugin qt \
            --output appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kestrel-AppImage
          path: "*.AppImage"
          if-no-files-found: error
